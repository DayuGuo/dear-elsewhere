<!doctype html>
<html lang="{{ t('en','zh-CN') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}{{ t('Dear Elsewhere · 致别处','致别处 · Dear Elsewhere') }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='paper.css') }}">
</head>
<body>
<a href="#main" class="skip">{{ t('Skip to content','跳至正文') }}</a>
<header class="top wrapper">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">❧</span> <span lang="en">Dear Elsewhere</span></a>
  <nav class="nav-main" aria-label="{{ t('Main navigation','主导航') }}">
    <a href="/#how-to-play">{{ t('How to play','玩法') }}</a>
    <a href="/#branches">{{ t('Letters','来信') }}</a>
    <a href="/about" {% if request.endpoint=='about' %}aria-current="page"{% endif %}>{{ t('About','关于') }}</a>
  </nav>
  <nav class="languages" aria-label="{{ t('Language','语言') }}">
    <a href="{{ language_url('en') }}" lang="en" {% if g.lang=='en' %}aria-current="true"{% endif %}>EN</a><span aria-hidden="true">/</span><a href="{{ language_url('zh') }}" lang="zh-CN" {% if g.lang=='zh' %}aria-current="true"{% endif %}>中文</a>
  </nav>
</header>
<main id="main" class="wrapper">{% block main %}{% endblock %}</main>
<footer class="wrapper"><span>{{ t('From somewhere, to someone, with curiosity.','从某处，寄给某人，带着好奇。') }}</span><span lang="en">Dear Elsewhere</span></footer>
</body>
</html>
