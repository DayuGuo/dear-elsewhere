<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}Dear Elsewhere · 致别处{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='paper.css') }}">
</head>
<body>
<a href="#main" class="skip">Skip to content</a>
<header class="top wrapper">
<a class="brand" href="/"><i aria-hidden="true" class="envelope"></i> Dear Elsewhere</a>
<nav aria-label="Main navigation">
  <a href="/#how-to-play">How to play</a>
  <a href="/#branches">Letters</a>
  <a href="/about" {% if request.endpoint=='about' %}aria-current="page"{% endif %}>About</a>
</nav>
</header>
<main id="main" class="wrapper">{% block main %}{% endblock %}</main>
<footer class="wrapper"><span>From somewhere, to someone, with curiosity.</span><span lang="zh">致别处</span></footer>
</body>
</html>
